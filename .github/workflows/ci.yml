name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Unit tests
        run: npm test

      - name: CLI smoke tests
        shell: bash
        run: |
          node bin/health-cli.js --version
          node bin/health-cli.js --help
          node bin/health-cli.js demo --no-color --no-emoji
          node bin/health-cli.js doctor --no-color
        env:
          HEALTH_CLI_HOME: ${{ runner.temp }}/health-cli
